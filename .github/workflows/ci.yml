
name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: csmqp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d csmqp_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGUSER: ci_test
      PGPASSWORD: ci_only_password
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: csmqp_dev
      TEST_PGDATABASE: csmqp_test
      FRONTEND_ORIGIN: http://localhost:5173,https://localhost
      JWT_SECRET_KEY: ci-only-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create dedicated test database
        run: |
          PGPASSWORD="$PGPASSWORD" psql \
            -h "$PGHOST" \
            -U "$PGUSER" \
            -d postgres \
            -c "CREATE DATABASE csmqp_test;"

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify database migration state
        working-directory: backend
        run: |
          python -m alembic current
          python -m alembic check

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
